<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon48.png" alt="" width="28" height="28">
    <h1>SkipSpotify</h1>
  </header>

  <section class="stat">
    <span id="count">0</span>
    <small>anuncios saltados</small>
  </section>

  <label class="row">
    <span>
      <strong>Activado</strong>
      <small>Detectar y saltar anuncios</small>
    </span>
    <input type="checkbox" id="enabled">
  </label>

  <label class="row">
    <span>
      <strong>Acelerar anuncio</strong>
      <small>Avanza el audio del anuncio hasta el final</small>
    </span>
    <input type="checkbox" id="fastForward">
  </label>

  <label class="row">
    <span>
      <strong>Silenciar pestaña</strong>
      <small>Silencio garantizado mientras dure</small>
    </span>
    <input type="checkbox" id="muteTab">
  </label>

  <button id="reset" type="button">Reiniciar contador</button>

  <script src="popup.js"></script>
</body>
</html>
